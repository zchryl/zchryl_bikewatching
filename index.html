<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="global.css" />

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <!-- Mapbox GL JS CSS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />

    <script src="map.js" type="module"></script>

    <title>Bikewatching</title>

</head>

<body>
    <div id='top'>
        <h1>Bikewatching</h1>
        <p>Visualizing bike trip patterns in Boston</p>

        <header id='timePanel'>
            Filter by Time:
            <input id='time-slider' type=range min="-1" max="1440" step="1" value="-1">
            <label id='time'>

                <time id='selected-time'></time>
                <em id='any-time'>(any time)</em>
            </label>
        </header>
    </div>



    <div id="map">

        <svg></svg>

    </div>

    <div class="legend">
        <label>Legend:</label>
        <div class='innerdiv' style="--departure-ratio: 1">

            <p>More departures</p>
        </div>
        <div class='innerdiv' style="--departure-ratio: 0.5">

            <p>Balanced</p>
        </div>
        <div class='innerdiv' style="--departure-ratio: 0">

            <p>More arrivals</p>
        </div>
    </div>




</body>

</html>
